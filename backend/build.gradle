plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.0'
    id 'com.google.protobuf' version '0.9.2' // Protobuf plugin
}

// Ensure repositories are declared (Spring Boot parent usually adds Maven Central, but explicit is fine)
repositories {
    mavenCentral()
}

springBoot {
    mainClass = 'com.naga.grpcweb.SpringBootGrpcWebApplication'
}

dependencies {
    // Spring Boot core (keep these)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Add Armeria dependencies
    implementation 'com.linecorp.armeria:armeria-spring-boot2-starter:1.24.3'
    implementation 'com.linecorp.armeria:armeria-grpc:1.24.3'

    // Optional but recommended Armeria additions
    implementation 'com.linecorp.armeria:armeria-brave:1.24.3'  // For tracing support

    // Core gRPC libraries
    implementation 'io.grpc:grpc-services:1.54.0'
    implementation 'io.grpc:grpc-netty-shaded:1.54.0'
    implementation 'io.grpc:grpc-protobuf:1.54.0'
    implementation 'io.grpc:grpc-stub:1.54.0'

    // Add Brave tracing libraries
    implementation 'io.zipkin.brave:brave-instrumentation-grpc:5.16.0'
    implementation 'io.zipkin.brave:brave:5.16.0'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.21.7"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.54.0"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            // Include generated sources in the compilation classpath
            srcDirs = ['src/main/java',
                       'build/generated/source/proto/main/grpc', // gRPC service code
                       'build/generated/source/proto/main/java'] // Protobuf message code
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}


clean {
    delete 'build/generated'
}

tasks.named('bootJar') {
    dependsOn 'generateProto'
}

// --- Frontend Tasks ---
task buildFrontend(type: Exec) {
    workingDir '../frontend' // Assumes frontend is one directory level up
    // Use 'cmd /c npm ...' on Windows if needed
    commandLine 'npm', 'run', 'build'
}

task copyFrontend(type: Copy) {
    dependsOn buildFrontend
    from '../frontend/build'
    into 'src/main/resources/static' // Standard Spring Boot static resource location
}

// Combined task for convenience
task buildAndCopyFrontend {
    dependsOn buildFrontend, copyFrontend
    group = 'application'
    description = 'Builds and copies the frontend to static resources'
}

//tasks.named('processResources') {
//    dependsOn 'copyFrontend'
//}

tasks.named('compileJava').configure {
    dependsOn 'generateProto'
}
