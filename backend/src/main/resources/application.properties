# Disable Spring's web server since Armeria will handle HTTP
spring.main.web-application-type=none

# Allow bean definition overriding if needed
spring.main.allow-bean-definition-overriding=true

# Armeria server configuration
armeria.server.port=8080

# CORS configuration if needed - Armeria handles this differently
# These are automatically applied to all services including gRPC-Web
armeria.server.cors.enabled=true
armeria.server.cors.allowed-origins=*
armeria.server.cors.allowed-headers=*
armeria.server.cors.allowed-methods=GET,POST,OPTIONS

# Keep logging configuration
logging.level.com.naga=TRACE
logging.level.root=INFO
logging.level.com.linecorp.armeria=DEBUG
